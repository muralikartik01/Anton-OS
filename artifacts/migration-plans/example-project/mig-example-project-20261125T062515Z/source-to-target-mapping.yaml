tables:
  retail_demo.bronze.customers:
    primary_key:
    - customer_id
    - _landed_at
    merge_key:
    - customer_id
    - _landed_at
    foreign_keys: []
    load_strategy: append-only; insert landing rows whose (key,_landed_at) are not yet present (idempotent)
  retail_demo.bronze.products:
    primary_key:
    - sku
    - _landed_at
    merge_key:
    - sku
    - _landed_at
    foreign_keys: []
    load_strategy: append-only, same as customers
  retail_demo.bronze.orders:
    primary_key:
    - order_id
    - _landed_at
    merge_key:
    - order_id
    - _landed_at
    foreign_keys: []
    load_strategy: append-only, same as customers
  retail_demo.bronze.order_items:
    primary_key:
    - item_id
    - _landed_at
    merge_key:
    - item_id
    - _landed_at
    foreign_keys: []
    load_strategy: append-only, same as customers
  retail_demo.silver.dim_customer:
    primary_key:
    - customer_id
    merge_key:
    - customer_id
    foreign_keys: []
    load_strategy: MERGE from latest Bronze row per customer_id (ROW_NUMBER over _landed_at desc); full-reload source, no incremental watermark
      in source
  retail_demo.silver.dim_product:
    primary_key:
    - sku
    merge_key:
    - sku
    foreign_keys: []
    load_strategy: MERGE, same as dim_customer
  retail_demo.silver.fact_orders:
    primary_key:
    - order_id
    merge_key:
    - order_id
    foreign_keys:
    - column: customer_id
      references: retail_demo.silver.dim_customer.customer_id
    load_strategy: MERGE after dim_customer; orphan customer_id -> quarantine
  retail_demo.silver.fact_order_lines:
    primary_key:
    - item_id
    merge_key:
    - item_id
    foreign_keys:
    - column: order_id
      references: retail_demo.silver.fact_orders.order_id
    - column: sku
      references: retail_demo.silver.dim_product.sku
    load_strategy: MERGE after dim_product and fact_orders; orphans -> quarantine
  retail_demo.silver.quarantine_rows:
    primary_key:
    - source_table
    - record_key
    - reason
    - _run_id
    merge_key:
    - source_table
    - record_key
    - reason
    - _run_id
    foreign_keys: []
    load_strategy: MERGE on key (idempotent per run_id)
